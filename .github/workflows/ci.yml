name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@ # v7.0.1 3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@ # v7.1.0 949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build
      - run: node dist/cli.js check
