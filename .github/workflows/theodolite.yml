name: theodolite
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  theodolite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Warn mode: findings are posted but do not fail the job. Remove `|| true` to enforce.
      - name: check
        run: npx theodolite@0.1.0 check > check.txt 2>&1 || true
      - name: comment
        if: ${{ !github.event.pull_request.head.repo.fork }}
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- theodolite -->';
            const read = (f) => fs.existsSync(f) ? fs.readFileSync(f, 'utf8').trim() : '';
            const check = read('check.txt') || 'No findings.';
            const body = [
              marker,
              '### theodolite',
              '```',
              check,
              '```',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
