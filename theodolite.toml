# theodolite's own matrix. The only thing this package writes is files into the user's repository:
# init writes the kit, status appends to STATUS.md. Scanning is read-only by construction.

[scan]
include = ["src/**"]
exclude = ["test/**", "templates/**", "dist/**"]
languages = ["ts"]
unmapped = "error"

[resources."fs.user-repo"]
paths = ["theodolite.toml", ".github/workflows/theodolite.yml", ".claude/", "AGENTS.md", "CLAUDE.md", ".gitignore", "STATUS.md"]
writers = ["src/init/**", "src/status/**"]
